[project]
name = "autoreel"
version = "0.1.0"
description = "Local AI clipper: turn long videos into captioned vertical shorts and auto-post them to YouTube Shorts, TikTok and Instagram Reels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "faster-whisper>=1.1",
    "anthropic>=0.70",
    "openai>=1.40",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
# Unofficial, browser-automation TikTok uploader (posts publicly without an audited API app).
tiktok-browser = ["tiktok-uploader>=1.1"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
autoreel = "autoreel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B904", "E501"]
